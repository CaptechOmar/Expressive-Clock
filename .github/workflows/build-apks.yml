name: Build APKs

# Runs on every push to these branches, and on demand from the Actions tab.
on:
  push:
    branches: [main, timer-presets-and-haptics]
  workflow_dispatch:

# Publishing a release needs write access to the repository's contents.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Set once in the repository's Settings > Secrets and variables > Actions. Without them the
      # job still builds the debug APK and skips the signed beta.
      BETA_KEYSTORE_BASE64: ${{ secrets.BETA_KEYSTORE_BASE64 }}
      BETA_KEYSTORE_PASSWORD: ${{ secrets.BETA_KEYSTORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # The runner already has an SDK. This step is only here to accept the licences so Gradle
      # can download compileSdk 37. `packages: ''` skips the action's default `tools` package,
      # which no longer exists and made an earlier run fail.
      - uses: android-actions/setup-android@v3
        with:
          packages: ''

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      # Unoptimised and slow, and signed with a key that changes every run, so it cannot update
      # a previous install. Only for finding bugs; use the beta release for everyday testing.
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: expressive-clock-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Note missing signing key
        if: env.BETA_KEYSTORE_BASE64 == ''
        run: echo "::notice::No BETA_KEYSTORE_BASE64 secret, so no beta release was built."

      # Optimised (R8) and signed with the permanent key, so each one installs over the last
      # without losing data. The run number becomes the version code.
      - name: Build beta APK
        if: env.BETA_KEYSTORE_BASE64 != ''
        run: |
          echo "$BETA_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/beta.jks"
          ./gradlew assembleBeta --stacktrace \
            -PclockStoreFile="$RUNNER_TEMP/beta.jks" \
            -PclockStorePassword="$BETA_KEYSTORE_PASSWORD" \
            -PclockKeyAlias=beta \
            -PclockKeyPassword="$BETA_KEYSTORE_PASSWORD" \
            -PclockBuild="${{ github.run_number }}"

      - name: Publish beta release
        if: env.BETA_KEYSTORE_BASE64 != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n="${{ github.run_number }}"
          cp app/build/outputs/apk/beta/*.apk "expressive-clock-beta-$n.apk"
          gh release create "beta-$n" "expressive-clock-beta-$n.apk" \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Beta $n" \
            --notes "Built from ${GITHUB_SHA::7} on ${GITHUB_REF_NAME}. Signed with the permanent beta key, so it installs over the previous beta and keeps your data."
