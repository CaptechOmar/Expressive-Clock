name: Build debug APK

# Runs on every push to this branch or main, and on demand from the Actions tab.
on:
  push:
    branches: [main, timer-presets-and-haptics]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # The runner already has an SDK. This step is only here to accept the licences so Gradle
      # can download compileSdk 37. `packages: ''` skips the action's default `tools` package,
      # which no longer exists and made the previous run fail.
      - uses: android-actions/setup-android@v3
        with:
          packages: ''

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: expressive-clock-debug
          path: app/build/outputs/apk/debug/*.apk
