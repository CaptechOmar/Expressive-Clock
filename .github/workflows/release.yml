name: Stable release

# Publishes a normal, non-beta release under the real application id (app.materialclock).
# Trigger it by pushing a tag like v1.0.0, or from the Actions tab with a version number.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number, e.g. 1.0.0'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      # Same permanent key as the betas (the secrets keep their original names).
      KEYSTORE_BASE64: ${{ secrets.BETA_KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.BETA_KEYSTORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Work out the version
        id: v
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            v="${{ github.event.inputs.version }}"
          else
            v="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Check the signing key exists
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::No BETA_KEYSTORE_BASE64 secret, so a stable release cannot be signed."
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3
        with:
          packages: ''

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          ./gradlew assembleRelease --stacktrace \
            -PclockStoreFile="$RUNNER_TEMP/release.jks" \
            -PclockStorePassword="$KEYSTORE_PASSWORD" \
            -PclockKeyAlias=beta \
            -PclockKeyPassword="$KEYSTORE_PASSWORD" \
            -PclockBuild="${{ github.run_number }}" \
            -PclockVersion="${{ steps.v.outputs.version }}"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${{ steps.v.outputs.version }}"
          cp app/build/outputs/apk/release/*.apk "expressive-clock-$v.apk"
          gh release create "v$v" "expressive-clock-$v.apk" \
            --target "$GITHUB_SHA" \
            --title "Expressive Clock $v" \
            --generate-notes
